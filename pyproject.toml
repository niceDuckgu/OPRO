[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opro"
version = "1.1.0"
description = "Orthogonal Panel-Relative Operators for Panel-Aware In-Context Image Generation (CVPR 2026)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [
    { name = "Sanghyeon Lee" },
    { name = "Minwoo Lee" },
    { name = "Euijin Shin" },
    { name = "Kangyeol Kim" },
    { name = "Seunghwan Choi" },
    { name = "Jaegul Choo" },
]
keywords = ["cvpr2026", "diffusion", "in-context-generation", "peft", "flux", "positional-encoding"]
dependencies = ["torch>=2.1"]

[project.optional-dependencies]
benchmark = ["numpy>=1.24", "Pillow>=10.1"]
flux = ["diffusers>=0.32,<0.33", "transformers"]
test = ["pytest>=8.0", "numpy>=1.24", "Pillow>=10.1", "diffusers>=0.32,<0.33"]

[project.urls]
"Project page" = "https://niceduckgu.github.io/OPRO/"
"Paper" = "https://arxiv.org/abs/2603.27637"
"Source" = "https://github.com/niceDuckgu/OPRO"

[tool.setuptools.packages.find]
include = ["opro*", "compositional_reasoning*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
